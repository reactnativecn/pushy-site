name: Verify v10.57.0 documentation
on:
  push:
    branches: [docs/native-host-update-api]
    paths: [.github/workflows/verify-v10570-docs.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Replace prerelease wording with the released version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          guide = Path('site/pages/docs/native-api.mdx')
          source = guide.read_text()
          old = '这些接口由 [SDK PR #641](https://github.com/reactnativecn/react-native-update/pull/641) 新增，不代表已经发布到 npm。集成前请确认所用 SDK 包含这些方法；`10.56.1` 及此前版本没有本文介绍的宿主入口。'
          new = '本文的原生 `configure`、`checkAndUpdate` 接口及 JS 选项 `nativeConfigSource` 均从 **react-native-update v10.57.0** 起提供，适用于 Android、iOS 和 HarmonyOS。请使用 **v10.57.0 或更高版本**；旧版 SDK 即使已有原生自动检测，也不包含本文的公开宿主入口。完整变更见 [v10.57.0 发布说明](https://github.com/reactnativecn/react-native-update/releases/tag/v10.57.0)。'
          assert source.count(old) == 1, 'Guide release wording drifted'
          guide.write_text(source.replace(old, new))
          api = Path('site/pages/docs/api.mdx')
          source = api.read_text()
          old = '  // 需包含 SDK PR #641 的原生版本，尚未标记为已发布。'
          new = '  // 此选项需 v10.57.0+ 版本；原生 configure/checkAndUpdate 同样需要 v10.57.0+，升级后须重新构建原生包。'
          assert source.count(old) == 1, 'API release wording drifted'
          api.write_text(source.replace(old, new))
          for path in (guide, api):
              text = path.read_text()
              assert '不代表已经发布到 npm' not in text
              assert '尚未标记为已发布' not in text
          PY
      - name: Build site and documentation index
        working-directory: site
        run: npm install --no-audit --no-fund && npm run build
      - name: Verify rendered version requirements and commit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pages = [p for p in Path('site/out').rglob('*.html') if 'native-api' in str(p)]
          assert pages, 'Native API page not built'
          assert any('10.57.0' in p.read_text() and 'nativeConfigSource' in p.read_text() for p in pages)
          print('Verified v10.57.0 version requirements in generated native API HTML.')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/pages/docs/native-api.mdx site/pages/docs/api.mdx
          git commit -m 'docs: mark native host APIs and nativeConfigSource available since v10.57.0'
          git push origin HEAD:refs/heads/docs/native-host-update-api
