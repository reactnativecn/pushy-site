name: github pages

on:
  push:
    branches:
      - master

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the sitemap's <lastmod> comes from each page's last commit.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site && npm i && node scripts/sync-changelog.mjs && npm run build && cd -
          mv site/out ./
          cp CNAME out/
          mv agreement out/agreement
          cp .nojekyll out/

      - name: Deploy
        timeout-minutes: 2
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out

      - name: Submit changed pages to search engines
        continue-on-error: true
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        # out/ has moved to the repo root; the script reads site/out/sitemap.xml.
        run: |
          mkdir -p site/out && cp out/sitemap.xml site/out/
          cd site && node scripts/submit-urls.mjs "${{ github.event.before }}"
